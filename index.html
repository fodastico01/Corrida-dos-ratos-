<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13203A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,'Segoe UI',sans-serif;background:#E8EDF4}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Corrida dos Ratos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: tabuleiro de uma coluna para celular — painel do mês no topo, contas, extrato em papel de recibo, barra fixa para avançar o mês */
:root{
  --bg:#E8EDF4; --surface:#FFFFFF; --sunk:#F3F6FA; --ink:#13203A; --muted:#5A6781; --line:#D2DAE6;
  --coin:#FFC83D; --coin-ink:#13203A; --gain:#12805A; --loss:#C23636; --warn:#A86A00;
  --gain-bg:#E3F4EC; --loss-bg:#FBE7E7; --warn-bg:#FFF3D6;
  --display:'Bungee',Impact,'Arial Black',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --shadow:0 1px 0 rgba(19,32,58,.05),0 10px 24px -16px rgba(19,32,58,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1422; --surface:#152038; --sunk:#101A2E; --ink:#E4EAF4; --muted:#93A0BA; --line:#26334F;
  --gain:#41C98E; --loss:#FF6E6E; --warn:#F2B53C; --gain-bg:#12301F; --loss-bg:#3A1A1F; --warn-bg:#382B10;
  --shadow:0 0 0 1px rgba(255,255,255,.02); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1422; --surface:#152038; --sunk:#101A2E; --ink:#E4EAF4; --muted:#93A0BA; --line:#26334F;
  --gain:#41C98E; --loss:#FF6E6E; --warn:#F2B53C; --gain-bg:#12301F; --loss-bg:#3A1A1F; --warn-bg:#382B10;
  --shadow:0 0 0 1px rgba(255,255,255,.02); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px 184px;display:grid;gap:14px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--coin);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--display);font-size:17px;letter-spacing:.02em;line-height:1}
.logo span{color:var(--muted)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted)}
.ghost.armado{border-color:var(--loss);color:var(--loss)}

.hud{background:var(--ink);color:var(--bg);border-radius:18px;padding:16px;display:grid;gap:14px}
.hud-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.mes{font-family:var(--display);font-size:22px;line-height:1}
.mes small{font-family:var(--body);font-size:12px;font-weight:600;opacity:.7;margin-left:6px;letter-spacing:.06em;text-transform:uppercase}
.track{display:flex;gap:3px}
.track i{width:8px;height:8px;border-radius:2px;background:currentColor;opacity:.18}
.track i.on{opacity:.9}
.track i.now{background:var(--coin);opacity:1}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.72}
.saldo{font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.saldo.neg{color:var(--loss)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--loss);color:#fff;vertical-align:middle;margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 8px}
.stats div{min-width:0}
.stats b{display:block;font-family:var(--mono);font-size:14px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.meter{display:grid;gap:6px}
.meter-bar{position:relative;height:12px;border-radius:6px;background:rgba(127,140,165,.28);overflow:hidden}
.meter-fill{position:absolute;inset:0 auto 0 0;background:var(--coin);border-radius:6px;transition:width .5s ease}
.meter-tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:currentColor;opacity:.5}
.meter-legend{display:flex;justify-content:space-between;font-size:11px;opacity:.75}

.card{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:grid;gap:12px}
.card h2{font-family:var(--display);font-size:14px;font-weight:400;letter-spacing:.03em;margin:0;text-wrap:balance}
.hint{font-size:13px;color:var(--muted);margin:0}

.conta{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.conta:first-of-type{border-top:0;padding-top:0}
.conta-nome{font-weight:600}
.conta-taxa{font-size:12px;color:var(--muted)}
.conta-valor{font-family:var(--mono);font-weight:600;text-align:right}
.conta-acoes{grid-column:1/-1;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 12px;font-weight:600;font-size:14px;flex:1}
.btn:active{transform:translateY(1px)}
.btn.coin{background:var(--coin);color:var(--coin-ink);border-color:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.alerta{border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:4px}
.alerta strong{font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.alerta.ruim{background:var(--loss-bg);color:var(--loss)}
.alerta.ruim p{color:var(--ink)}
.alerta.bom{background:var(--gain-bg);color:var(--gain)}
.alerta.bom p{color:var(--ink)}
.alerta.neutro{background:var(--warn-bg);color:var(--warn)}
.alerta.neutro p{color:var(--ink)}
.alerta p{margin:0}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sunk);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;display:grid;gap:1px;font-weight:600;font-size:13px}
.seg button small{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.humor{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.humor-bar{flex:1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.humor-bar i{display:block;height:100%;border-radius:4px;transition:width .4s}

.parcela{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.parcela span:last-child{font-family:var(--mono);white-space:nowrap}

.recibo{background:var(--sunk);border-radius:6px;padding:14px 14px 18px;font-family:var(--mono);font-size:13px;position:relative;
  -webkit-mask:radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x;mask:radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x}
.recibo-cab{text-align:center;font-size:11px;letter-spacing:.12em;color:var(--muted);padding-bottom:8px;border-bottom:1px dashed var(--line);margin-bottom:8px}
.linha{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.linha span:first-child{min-width:0}
.linha .v{white-space:nowrap;font-variant-numeric:tabular-nums}
.linha .v.pos{color:var(--gain)}
.linha .v.neg{color:var(--loss)}
.linha.total{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-weight:600}

.barra{z-index:2;position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.barra-in{max-width:448px;margin:0 auto;display:grid;gap:6px}
.avancar{border:0;border-radius:14px;padding:16px;background:var(--coin);color:var(--coin-ink);font-family:var(--display);font-size:16px;letter-spacing:.02em;box-shadow:0 6px 0 -1px #C9951B}
.avancar:active{transform:translateY(3px);box-shadow:0 3px 0 -1px #C9951B}
.barra-in p{margin:0;text-align:center;font-size:12px;color:var(--muted)}

.overlay{position:fixed;inset:0;background:rgba(8,14,26,.62);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;overflow-y:auto}
.sheet{background:var(--surface);color:var(--ink);border-radius:20px;padding:20px;width:100%;max-width:448px;display:grid;gap:14px;animation:sobe .28s ease-out;margin-top:auto}
@keyframes sobe{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.meter-fill,.humor-bar i{transition:none}}
.sheet h3{font-family:var(--display);font-size:20px;font-weight:400;line-height:1.15;margin:0;text-wrap:balance}
.sheet p{margin:0}
.tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.tag.ruim{color:var(--loss)} .tag.bom{color:var(--gain)} .tag.neutro{color:var(--warn)}
.valor-evento{font-family:var(--mono);font-size:26px;font-weight:600}
.opcoes{display:grid;gap:8px}
.opcao{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.opcao b{font-size:15px}
.opcao span{font-size:13px;color:var(--muted)}
.opcao.coin{background:var(--coin);border-color:transparent;color:var(--coin-ink)}
.opcao.coin span{color:var(--coin-ink);opacity:.75}
.campo{display:grid;gap:6px}
.campo input{font-family:var(--mono);font-size:24px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);width:100%;box-sizing:border-box}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-family:var(--mono)}
.erro{color:var(--loss);font-size:13px;min-height:1em}
.regras{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.intro-logo{font-family:var(--display);font-size:34px;line-height:.95}
.nota{font-family:var(--display);font-size:64px;line-height:1}
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.resumo div{background:var(--sunk);border-radius:12px;padding:10px 12px;min-width:0}
.resumo b{display:block;font-family:var(--mono);font-size:16px;margin-top:2px}
.row{display:flex;gap:8px}
.fases{display:grid;gap:8px}
.fase{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--sunk)}
.fase-n{grid-row:span 2;font-family:var(--display);font-size:22px;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--coin);color:var(--coin-ink)}
.fase b{font-size:15px}
.fase span{font-size:12.5px;color:var(--muted)}
.fase.trancada{opacity:.6}
.fase.trancada .fase-n{background:var(--line);color:var(--muted)}
.cadeado{grid-column:1/-1;display:grid;gap:6px;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}
.cadeado-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.cadeado-bar i{display:block;height:100%;background:var(--coin)}
.pulos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pulo{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:600;font-size:14px}
.pulo[disabled]{opacity:.4;cursor:not-allowed}
:root{ --c-rf:#2F6FDB; --c-lci:#4FA3D9; --c-ipca:#7B5CD6; --c-fii:#D9792B; --c-rv:#0E9384; --c-conta:#8A96AD; --c-ouro:#B8860B }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --c-rf:#6D9BF0; --c-lci:#79C0EE; --c-ipca:#A58CF0; --c-fii:#F2A35E; --c-rv:#3CC7B5; --c-conta:#6C7895; --c-ouro:#E3B341 }}
:root[data-theme="dark"]{ --c-rf:#6D9BF0; --c-lci:#79C0EE; --c-ipca:#A58CF0; --c-fii:#F2A35E; --c-rv:#3CC7B5; --c-conta:#6C7895; --c-ouro:#E3B341 }
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:1px}
.prog{height:6px;border-radius:3px;background:rgba(127,140,165,.28);overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:var(--coin)}
.aloc{display:flex;height:12px;border-radius:6px;overflow:hidden;background:rgba(127,140,165,.28)}
.aloc i{display:block;height:100%}
.aloc-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;opacity:.85}
.aloc-leg span{white-space:nowrap}
.card .aloc{background:var(--sunk)}
.card .aloc-leg{color:var(--muted);opacity:1}
.var{font-size:12px;font-weight:500;display:block}
.var.pos{color:var(--gain)} .var.neg{color:var(--loss)}
.hud .var.pos{color:#41C98E} .hud .var.neg{color:#FF8A8A}
.preview{font-size:13px;background:var(--sunk);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.preview b{font-family:var(--mono)}
button.fase{text-align:left;width:100%;cursor:pointer}
button.fase:disabled{cursor:not-allowed}
button.fase.atual{border-color:var(--coin);box-shadow:0 0 0 1px var(--coin)}
.tabela-ir{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px;background:var(--sunk);border-radius:10px;padding:10px 12px}
.tabela-ir span:nth-child(even){font-family:var(--mono)}

.ficha{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ficha>div{display:grid;gap:4px;align-content:start;min-width:0}
.fl{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.fl span{color:var(--muted);min-width:0}
.fl b{font-family:var(--mono);font-weight:600;white-space:nowrap}
.label-c{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sonho{display:grid;gap:4px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.sonho b{font-size:15px}
.opp{display:grid;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.opp:first-of-type{border-top:0;padding-top:0}
.opp-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.opp-top b{font-size:15px;min-width:0}
.opp-top .num{font-weight:600;white-space:nowrap}
.opp-dados{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.opp-dados b{color:var(--ink);font-family:var(--mono);font-weight:600}
.escolhas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.escolha{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.escolha b{font-size:14px}
.escolha span{font-size:12px;color:var(--muted)}
.escolha.atual{border-color:var(--coin);box-shadow:0 0 0 1px var(--coin)}
@media (max-width:360px){.ficha,.escolhas{grid-template-columns:1fr}}

.cobrir{display:grid;gap:6px;margin-top:6px}
.cobrir .btn{display:grid;gap:1px;text-align:left;color:var(--ink)}
.cobrir .btn.coin{color:var(--coin-ink)}
.cobrir .btn span{font-size:12px;font-weight:500;opacity:.8}

.emp-bloco{display:grid;gap:6px;padding-block:6px;border-top:1px solid var(--line)}

.humor-hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px}
.humor-hud-bar{height:10px;border-radius:5px;background:rgba(127,140,165,.28);overflow:hidden}
.humor-hud-bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
.humor-hud b{font-size:15px;min-width:2ch;text-align:right}
.humor-hud-dica{grid-column:1/-1;font-size:11.5px;opacity:.75}
@media (prefers-reduced-motion:reduce){.humor-hud-bar i{transition:none}}

.cotas{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:6px 10px}
.cotas b{color:var(--ink);font-weight:600}

.seg-hud{background:rgba(127,140,165,.18)}
.seg-hud button{color:inherit}
.seg-hud button small{color:inherit;opacity:.7}
.seg-hud button[aria-pressed="true"]{background:var(--coin);color:var(--coin-ink);box-shadow:none}
.seg-hud button[aria-pressed="true"] small{opacity:.8}
.seg-hud small.efeito{font-family:var(--body);font-size:11px}

.pontos{display:grid;gap:6px;background:var(--sunk);border-radius:12px;padding:12px 14px}
.pontos-topo{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pontos-topo b{font-family:var(--display);font-size:26px;font-weight:400;color:var(--ink)}
.pontos-topo.campanha{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.pontos-lista{display:grid;gap:3px}
.recorde{justify-self:start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--coin);color:var(--coin-ink);border-radius:999px;padding:3px 10px}
.ranking{display:grid;gap:4px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.ranking .fl span{font-size:12.5px}
.humor-hud-conta{grid-column:1/-1;font-size:11.5px;opacity:.85}
.humor-hud-conta b{font-family:var(--mono)}

/* ================= responsivo ================= */
.painel,.corpo{display:grid;gap:14px;min-width:0}
.corpo>*{min-width:0}
.saldo{font-size:clamp(26px,8.2vw,34px)}
@media (max-width:359px){
  .app{padding-inline:10px;gap:10px}
  .hud{padding:13px;border-radius:14px}
  .card{padding:14px}
  .seg-hud button{padding:7px 2px;font-size:12px}
  .seg-hud button small{font-size:10.5px}
  .avancar{padding:13px;font-size:15px}
  .pulo{font-size:13px;padding:8px}
  .barra{padding-inline:10px}
}
/* tablet: painel em cima, cartões em duas colunas */
@media (min-width:720px){
  .app:has(>.painel){max-width:980px;padding-inline:24px}
  .corpo{display:block;columns:2;column-gap:14px}
  .corpo>*{break-inside:avoid;margin-bottom:14px;display:grid}
  .barra-in{max-width:560px}
  .overlay{align-items:flex-start}
  .sheet{max-width:520px;margin-block:auto}
}
/* computador e celular deitado: painel fixo à esquerda com os botões de avançar */
@media (min-width:1080px), (orientation:landscape) and (max-height:520px) and (min-width:700px){
  .app:has(>.painel){max-width:1360px;grid-template-columns:minmax(330px,400px) 1fr;align-items:start;column-gap:20px;padding-bottom:40px}
  .app>.top{grid-column:1/-1}
  .painel{position:sticky;top:14px;max-height:calc(100vh - 84px);overflow-y:auto;scrollbar-width:thin}
  .painel .barra{position:sticky;bottom:0;padding:14px 0 2px;background:linear-gradient(to top,var(--bg) 78%,transparent)}
  .barra-in{max-width:none}
}
@media (min-width:1500px){ .corpo{columns:3} }
@media (orientation:landscape) and (max-height:520px){
  .corpo{columns:1}
  .barra-in p{display:none}
  .avancar{padding:11px}
  .pulo{padding:8px}
  .top{padding-block:0}
  .app:has(>.painel){padding-block:8px 16px;gap:8px}
  .painel{top:8px;max-height:calc(100vh - 58px)}
  .barra-in{grid-template-columns:1fr 1fr;align-items:stretch}
  .avancar{font-size:14px}
  .pulos{gap:6px}
  .pulo{font-size:12.5px;padding:6px}
}
.parc-bloco{display:grid;gap:6px;padding-block:8px;border-top:1px solid var(--line)}
.parc-bloco:first-of-type{border-top:0}
.saldo-m{font-size:clamp(24px,7vw,28px)}
.conta-hud{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,196,57,.12);border:1px solid rgba(255,196,57,.45);border-radius:12px;padding:10px 12px}
.conta-hud>div{display:grid;gap:2px;min-width:0}
.conta-hud b{font-size:20px;font-weight:600;white-space:nowrap}
.conta-hud .pill{justify-self:start;margin-left:0}
.conta-hud.neg{background:rgba(255,110,110,.14);border-color:rgba(255,110,110,.55)}
.conta-hud.neg b{color:#FF8A8A}
.btn-hud{border:0;border-radius:10px;background:var(--coin);color:var(--coin-ink);font-weight:700;font-size:13px;padding:9px 12px;white-space:nowrap}
.stats.stats3{grid-template-columns:repeat(3,minmax(0,1fr))}
.conta-f1{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.conta-f1>div{min-width:0}
@keyframes pisca{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 3px var(--coin)}}
.card.pisca{animation:pisca 1.2s ease-out .3s}
@media (prefers-reduced-motion:reduce){.card.pisca{animation:none}}
.meta-evo{display:grid;gap:4px}
.meta-evo .fl b{font-size:12.5px}
.selos{display:flex;flex-wrap:wrap;gap:6px}
.selo{font-size:12px;font-weight:600;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* abas */
.abas{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:6px;margin-inline:-2px;background:var(--bg);border-radius:0 0 14px 14px;box-shadow:0 6px 10px -8px rgba(0,0,0,.25)}
.abas button{position:relative;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 2px;font-size:13px;font-weight:600;min-width:0;white-space:nowrap;overflow:visible}
.abas button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--coin);color:var(--coin-ink);font-size:11px;font-style:normal;font-weight:700;line-height:18px;text-align:center}
.badge.alerta{background:var(--loss);color:#fff}
@media (min-width:720px){ .corpo>.abas{column-span:all;margin-bottom:14px} }
.tab-renda{display:grid;grid-template-columns:minmax(0,1.6fr) auto auto auto;gap:6px 10px;font-size:13px;align-items:baseline}
.tab-renda>span:not(.label-c),.tab-renda>b{min-width:0}
.tab-renda .num{white-space:nowrap}

.cargo-atual{display:grid;gap:2px}
.cargo-atual b{font-family:var(--display);font-size:22px;font-weight:400;line-height:1.1}
.escada{display:flex;gap:6px;align-items:center}
.escada i{flex:1;height:8px;border-radius:4px;background:rgba(127,140,165,.28)}
.escada i.feito{background:var(--gain)}
.escada i.atual{background:var(--coin)}
.reqs{display:grid;gap:3px;background:var(--sunk);border-radius:10px;padding:8px 10px}
.corpo .card{scroll-margin-top:64px}
/* tabuleiro-calendário */
.tabuleiro{position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,minmax(46px,auto));gap:4px;background-size:cover;background-position:center;border-radius:12px}
.casa{display:flex;flex-direction:column;justify-content:space-between;padding:4px 6px;border-radius:9px;background:rgba(127,140,165,.18);min-width:0;min-height:46px}
.casa.passou{background:rgba(127,140,165,.10)}
.casa.passou .casa-mes{opacity:.55}
.casa.agora{background:rgba(255,196,57,.22);box-shadow:inset 0 0 0 1.5px var(--coin)}
.casa-mes{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.casa-ic{font-size:13px;line-height:1;display:flex;gap:2px;justify-content:flex-end;min-height:14px}
.casa-ic .marca{font-style:normal}
.tab-centro{grid-row:2/4;grid-column:2/4;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;text-align:center;padding:4px}
.tab-centro .mes{font-size:20px}
.tab-centro small{font-size:11px;opacity:.75;letter-spacing:.04em}
.tab-centro .prog{width:80%;min-width:0;flex:none}
.tab-centro .volta{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:10px}
.peao{position:absolute;left:calc(var(--c)*25% + 12.5%);top:calc(var(--r)*25% + 12.5%);transform:translate(-30%,-20%);font-size:24px;line-height:1;transition:left .18s ease-out, top .18s ease-out;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));z-index:2}
.peao img{width:30px;height:30px;object-fit:contain;display:block}
.peao.pula{animation:pula .2s ease-out}
@keyframes pula{50%{margin-top:-8px}}
@media (prefers-reduced-motion:reduce){.peao{transition:none}.peao.pula{animation:none}}
@media (min-width:1080px){ .tabuleiro{grid-template-rows:repeat(4,minmax(54px,auto))} .casa-ic{font-size:15px} }
.efeito-escolha{font-size:13px;margin:2px 0 0;opacity:.9}
.tab-casa{font-size:30px;line-height:1}
.tab-casa img{width:44px;height:44px;object-fit:contain;display:block}
.casa-atual{display:flex;gap:12px;align-items:center}
.casa-atual>div{display:grid;gap:2px}

.casa-ic-g{font-size:38px;line-height:1}
.tab-fam{font-size:16px;margin-left:2px}
.eixo{display:grid;grid-template-columns:92px 1fr 32px;gap:8px;align-items:center;font-size:13px}

.final-hist{display:grid;gap:6px;background:var(--sunk);border-left:4px solid var(--coin);border-radius:12px;padding:12px 14px}
.final-hist b{font-family:var(--display);font-size:20px;font-weight:400}
.final-hist p{margin:0;font-size:14px;line-height:1.5}
.tempo-hud{margin-top:-4px}
[data-info]{cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.ii{font-style:normal;font-size:.85em;opacity:.45;margin-left:2px;font-weight:400}

.info-sheet p{margin:8px 0}
.info-lista{margin:8px 0;padding:6px 10px;border-radius:10px;background:rgba(127,140,165,.12)}
.info-lista .fl.tot{border-top:1px solid rgba(127,140,165,.3);margin-top:4px;padding-top:6px}
