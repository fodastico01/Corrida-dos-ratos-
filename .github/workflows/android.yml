name: Gerar app Android

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Numero da versao (inteiro, sempre maior que o anterior)"
        required: true
        default: "1"
      version_name:
        description: "Nome da versao (ex.: 1.0)"
        required: true
        default: "1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      KEY_ALIAS: upload
    steps:
      - uses: actions/checkout@v4

      - name: Conferir segredos da chave
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then echo "::error::Faltam os segredos ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar o Android SDK (licencas e plataforma 36)
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          echo "sdkmanager: $SDKM"
          (yes | "$SDKM" --licenses > /dev/null) || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Montar o projeto
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          node prepare.mjs
          npx cap add android
          npx cap sync android
          pip install pillow
          python3 icones.py
          python3 patch-android.py

      - name: Compilar (AAB para a loja e APK para teste)
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Reunir arquivos
        run: |
          mkdir -p saida
          cp android-app/android/app/build/outputs/bundle/release/app-release.aab "saida/corrida-dos-ratos-v${VERSION_NAME}-${VERSION_CODE}.aab"
          cp android-app/android/app/build/outputs/apk/release/app-release.apk "saida/corrida-dos-ratos-v${VERSION_NAME}-${VERSION_CODE}.apk"
          ls -la saida

      - uses: actions/upload-artifact@v4
        with:
          name: app-android-${{ inputs.version_code }}
          path: saida/*

      - name: Publicar em Releases (para baixar pelo celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${VERSION_CODE}" saida/* --title "App Android ${VERSION_NAME} (${VERSION_CODE})" --notes "Arquivos .aab (loja) e .apk (teste direto no celular)." --prerelease
